server:
  port: 7202

spring:
  application:
    name: sgai-buildingControl
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    password:
    timeout: 5000
    lettuce:
      pool:
        max-active: 200
        max-wait: -1
        max-idle: 10
        min-idle: 0
  cloud:
    nacos:
      config:
        server-addr: 10.168.56.101:8848
        group: DEFAULT_GROUP
        namespace: public
        username:
        password:
      discovery:
        server-addr: ${spring.cloud.nacos.config.server-addr}
        group: ${spring.cloud.nacos.config.group}
        namespace: event-test
        username:
        password:
  config:
    import:
      - optional:nacos:jeecg.yaml
      - optional:nacos:buildingControl-dev.yaml
  main:
    allow-bean-definition-overriding: true