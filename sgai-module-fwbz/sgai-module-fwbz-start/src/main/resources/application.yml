server:
  port: 7206
spring:
  application:
    name: sgai-fwbz-dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
  config:
    import:
      - optional:nacos:jeecg.yaml
      - optional:nacos:fwbz-dev.yaml
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        namespace: public
        username:
        password:
      discovery:
        server-addr: ${spring.cloud.nacos.config.server-addr}
        namespace: public
        username:
        password:
        group: DEFAULT_GROUP

mybatis-plus:
